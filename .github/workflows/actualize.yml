name: Actualize enterprise solution

on:
  workflow_dispatch:
    inputs:
      solution_definitions_release_tag:
        description: Solution Definitions release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  actualize:
    name: Actualize enterprise solution
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      HCP_STACK_ID: ${{ vars.SOLUTION_ACTUALIZATION_STACK_ID }}
      HCP_TOKEN_SECRET_ID: ${{ vars.AMIASEA_TFE_TOKEN_VERSIONLESS_ID }}
      RELEASE_TAG: ${{ inputs.solution_definitions_release_tag }}

    steps:
      - name: Authenticate to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_INSTITUTIVE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_INSTITUTIVE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_INSTITUTIVE_SUBSCRIPTION_ID }}

      - name: Retrieve HCP Terraform token
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:HCP_TOKEN_SECRET_ID) {
            throw "AMIASEA_TFE_TOKEN_VERSIONLESS_ID is not configured."
          }

          $token = az keyvault secret show `
            --id $env:HCP_TOKEN_SECRET_ID `
            --query value `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or -not $token) {
            throw "Failed to retrieve HCP Terraform token."
          }

          Write-Output "::add-mask::$token"
          "HCP_TOKEN=$token" >> $env:GITHUB_ENV

      - name: Actualize
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:HCP_STACK_ID -or -not $env:HCP_TOKEN) {
            throw "Stack ID or HCP Terraform token is missing."
          }

          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+-[A-Za-z0-9]+$') {
            throw "Invalid Solution Definitions release tag: $env:RELEASE_TAG"
          }

          $api = "https://app.terraform.io/api/v2"

          $headers = @{
            Authorization = "Bearer $env:HCP_TOKEN"
            Accept        = "application/vnd.api+json"
          }

          function Invoke-HcpApi {
            param(
              [Parameter(Mandatory)]
              [ValidateSet("GET", "PATCH", "POST")]
              [string]$Method,

              [Parameter(Mandatory)]
              [string]$Path,

              [object]$Body
            )

            $parameters = @{
              Uri         = "$api$Path"
              Method      = $Method
              Headers     = $headers
              ErrorAction = "Stop"
            }

            if ($null -ne $Body) {
              $parameters.ContentType = "application/vnd.api+json"
              $parameters.Body = $Body | ConvertTo-Json -Depth 20 -Compress
            }

            Invoke-RestMethod @parameters
          }

          function Get-HcpCollection {
            param(
              [Parameter(Mandatory)]
              [string]$Path
            )

            $items = @()
            $next = $Path

            while ($next) {
              $response = Invoke-HcpApi -Method GET -Path $next
              $items += @($response.data)
              $next = $response.links.next

              if ($next -match '^https://') {
                $next = $next -replace '^https://app\.terraform\.io/api/v2', ''
              }
            }

            return ,$items
          }

          Write-Host "Stack: $env:HCP_STACK_ID"
          Write-Host "Solution Definitions release: $env:RELEASE_TAG"

          # Locate the actualization variable set.

          $varsets = @(
            Get-HcpCollection `
              -Path "/organizations/amiasea/varsets?q=enterprise-solution-actualization"
          )

          $varset = $varsets |
            Where-Object {
              $_.attributes.name -eq "enterprise-solution-actualization"
            } |
            Select-Object -First 1

          if (-not $varset) {
            throw "Variable set 'enterprise-solution-actualization' was not found."
          }

          # Locate or create the normal deployment release-selection variable.

          $variables = @(
            Get-HcpCollection `
              -Path "/varsets/$($varset.id)/relationships/vars"
          )

          $releaseVariable = $variables |
            Where-Object {
              $_.attributes.key -eq "solution_definitions_release_tag"
            } |
            Select-Object -First 1

          if ($releaseVariable) {
            Write-Host "Updating existing release-selection variable."

            $updateBody = @{
              data = @{
                type = "vars"
                attributes = @{
                  value = $env:RELEASE_TAG
                }
              }
            }

            $updatedVariable = Invoke-HcpApi `
              -Method PATCH `
              -Path "/varsets/$($varset.id)/relationships/vars/$($releaseVariable.id)" `
              -Body $updateBody
          }
          else {
            Write-Host "Creating initial release-selection variable."

            $createBody = @{
              data = @{
                type = "vars"
                attributes = @{
                  key         = "solution_definitions_release_tag"
                  value       = $env:RELEASE_TAG
                  category    = "terraform"
                  hcl         = $false
                  sensitive   = $false
                  description = "Solution Definitions release used for normal solution actualization."
                }
              }
            }

            $updatedVariable = Invoke-HcpApi `
              -Method POST `
              -Path "/varsets/$($varset.id)/relationships/vars" `
              -Body $createBody
          }

          if ($updatedVariable.data.attributes.key -ne "solution_definitions_release_tag") {
            throw "HCP Terraform did not confirm the release-selection variable."
          }

          if ($updatedVariable.data.attributes.value -cne $env:RELEASE_TAG) {
            throw "HCP Terraform did not confirm the requested release selection."
          }

          Write-Host "Release selection is $env:RELEASE_TAG."

          # Capture the current configuration sequence.

          $configurations = @(
            Get-HcpCollection `
              -Path "/stacks/$env:HCP_STACK_ID/stack-configurations?page%5Bsize%5D=100"
          )

          $baselineSequence = 0

          if ($configurations.Count -gt 0) {
            $baselineConfiguration = $configurations |
              Sort-Object {
                [int]$_.attributes.'sequence-number'
              } -Descending |
              Select-Object -First 1

            $baselineSequence = [int]$baselineConfiguration.attributes.'sequence-number'
          }

          Write-Host "Baseline configuration sequence: $baselineSequence"

          # Trigger VCS ingestion from the configured branch.

          $fetchStartedAt = [DateTimeOffset]::UtcNow

          $fetch = Invoke-WebRequest `
            -Method POST `
            -Uri "$api/stacks/$env:HCP_STACK_ID/fetch-latest-from-vcs" `
            -Headers $headers `
            -ContentType "application/vnd.api+json" `
            -ErrorAction Stop

          if ($fetch.StatusCode -notin @(200, 204)) {
            throw "Unexpected VCS fetch response: $($fetch.StatusCode)"
          }

          Write-Host "VCS fetch accepted."

          # Discover the configuration created by this fetch.

          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(10)
          $configuration = $null

          while ([DateTimeOffset]::UtcNow -lt $deadline) {
            $configurations = @(
              Get-HcpCollection `
                -Path "/stacks/$env:HCP_STACK_ID/stack-configurations?page%5Bsize%5D=100"
            )

            $configuration = $configurations |
              Where-Object {
                [int]$_.attributes.'sequence-number' -gt $baselineSequence -and
                [DateTimeOffset]::Parse($_.attributes.'created-at') -ge $fetchStartedAt.AddMinutes(-1)
              } |
              Sort-Object {
                [int]$_.attributes.'sequence-number'
              } -Descending |
              Select-Object -First 1

            if ($configuration) {
              break
            }

            Write-Host "Waiting for a new Stack configuration."
            Start-Sleep -Seconds 10
          }

          if (-not $configuration) {
            throw "VCS fetch did not create a new Stack configuration."
          }

          $configurationId = $configuration.id

          Write-Host "Configuration: $configurationId"
          Write-Host "Sequence: $($configuration.attributes.'sequence-number')"

          # Wait for configuration preparation.

          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(10)
          $configurationStatus = $null

          while ([DateTimeOffset]::UtcNow -lt $deadline) {
            $detail = Invoke-HcpApi `
              -Method GET `
              -Path "/stack-configurations/$configurationId"

            $configurationStatus = $detail.data.attributes.status

            Write-Host "Configuration status: $configurationStatus"

            if ($configurationStatus -eq "completed") {
              break
            }

            if ($configurationStatus -in @(
              "errored",
              "failed",
              "canceled",
              "cancelled"
            )) {
              throw "Configuration preparation failed: $configurationStatus"
            }

            Start-Sleep -Seconds 10
          }

          if ($configurationStatus -ne "completed") {
            throw "Timed out waiting for configuration preparation."
          }

          # Find the normal solutions deployment run.

          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(10)
          $deploymentRun = $null

          while ([DateTimeOffset]::UtcNow -lt $deadline) {
            $runs = @(
              Get-HcpCollection `
                -Path "/stack-configurations/$configurationId/stack-deployment-runs"
            )

            $deploymentRun = $runs |
              Where-Object {
                $_.attributes.deployment -eq "solutions" -and
                $_.relationships.'stack-configuration'.data.id -eq $configurationId
              } |
              Select-Object -First 1

            if ($deploymentRun) {
              break
            }

            Write-Host "Waiting for the solutions deployment run."
            Start-Sleep -Seconds 10
          }

          if (-not $deploymentRun) {
            throw "No solutions deployment run appeared for configuration '$configurationId'."
          }

          $runId = $deploymentRun.id

          Write-Host "Deployment run: $runId"

          # Wait for planning and approve this run.

          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(345)
          $approved = $false
          $failureStatuses = @(
            "failed",
            "errored",
            "abandoned",
            "canceled",
            "cancelled"
          )

          while ([DateTimeOffset]::UtcNow -lt $deadline) {
            $response = Invoke-HcpApi `
              -Method GET `
              -Path "/stack-deployment-runs/$runId"

            $status = $response.data.attributes.status

            Write-Host "Deployment run '$runId': $status"

            if ($status -eq "succeeded") {
              break
            }

            if ($status -in $failureStatuses) {
              throw "Deployment failed: $status"
            }

            if (
              -not $approved -and
              $status -in @(
                "pre_deploying_pending_operator",
                "deploying_pending_operator"
              )
            ) {
              $null = Invoke-HcpApi `
                -Method POST `
                -Path "/stack-deployment-runs/$runId/approve-all-plans"

              $approved = $true
              Write-Host "Approved deployment run '$runId'."
            }

            Start-Sleep -Seconds 20
          }

          if ($status -ne "succeeded") {
            throw "Timed out waiting for deployment run '$runId'. Last status: $status"
          }

          Write-Host "Enterprise solution actualization succeeded."